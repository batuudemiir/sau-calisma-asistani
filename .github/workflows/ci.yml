name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Yalnızca emulator ve sahte değerler kullanılır; hiçbir gizli anahtar gerekmez.
env:
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-sau-calisma.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-sau-calisma
  NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Test, lint, tip kontrolü, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Uçtan uca (Playwright + Firebase Emulator)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Tarayıcı ikili dosyaları sürüme göre önbelleklenir; sistem bağımlılıkları her seferinde kurulur
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_USE_EMULATOR: "true"
          DEMO_MODE: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
